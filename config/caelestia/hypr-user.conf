# Custom touchpad gestures
# Move the active tiled window with a 3-finger swipe.
gesture = 3, left, dispatcher, movewindow, l
gesture = 3, right, dispatcher, movewindow, r
gesture = 3, up, dispatcher, movewindow, u
gesture = 3, down, dispatcher, movewindow, d

# Let window borders be grabbed with the mouse for resizing.
general {
    resize_on_border = true
}

# Privacy: keep session lock surfaces isolated from the unlocked session.
misc {
    session_lock_xray = false
}

# Display switcher, GNOME-style. The default Super+P pin shortcut is moved
# to Super+Alt+P so Super+P can control laptop/external display modes.
unbind = Super, P
bind = Super, P, exec, ~/.config/caelestia/scripts/display-menu.sh
bind = Super+Alt, P, pin

# Full settings fallback. Caelestia covers daily shell controls; GNOME Settings
# covers the deeper system panels like users, printers, privacy and details.
bind = Super, I, exec, app2unit -- ~/.config/caelestia/scripts/gnome-settings.sh
bind = Super+Shift, I, global, caelestia:systemControl

# Keep only GNOME Files/Nautilus in the daily workflow.
unbind = Super+Alt, E
