# User overrides for Caelestia Hyprland.
# Edit this file instead of ~/.config/hypr/variables.conf.
# The Caelestia repo can update variables.conf, but this file is yours.

# Default apps.
# Keep GNOME Files/Nautilus as the file manager instead of Thunar.
$fileExplorer = nautilus

# Number of fingers for horizontal touchpad workspace swipes.
# 4 means swipe left/right with 4 fingers to move between workspaces.
$workspaceSwipeFingers = 4

# Number of fingers for Caelestia's normal vertical gestures.
# Kept on 4 here, but the default vertical gesture actions are disabled below in your
# local gestures config so 3-finger swipes can be used for moving windows.
$gestureFingers = 4

# Number of fingers for Caelestia's extra vertical gesture.
# In the default config this is used for suspend/hibernate on swipe down.
$gestureFingersMore = 5

# Gap between tiled windows.
# Lower = windows sit closer together.
$windowGapsIn = 1

# Gap between windows and the edge of the screen/bar.
# Lower = windows use more screen space.
$windowGapsOut = 1

# Outer gap when there is only one tiled window on the workspace.
# 0 makes the first window opened on an empty workspace use the whole usable area.
$singleWindowGapsOut = 0

# Corner radius when there is only one tiled window on the workspace.
# 0 removes the black rounded edge when a single window fills the workspace.
$singleWindowRounding = 0

# Gap between workspace groups in Caelestia's scrolling workspace layout.
# Lower = workspace transitions feel tighter.
$workspaceGaps = 10

# Battery-friendly visual tuning.
# Keep the look clean, but reduce the most expensive compositor work on Intel graphics.
$blurEnabled = true
$blurSize = 4
$blurPasses = 1
$blurPopups = false
$shadowEnabled = false
$windowOpacity = 1

# Tiny corner radius keeps a soft look without wasting screen edges.
$windowRounding = 2

# Tiny focus border, useful to see the active window.
$windowBorderSize = 1

# Window border colours.
# Active is clear; inactive is visible but quiet.
$activeWindowBorderColour = rgba($primarye6)


$inactiveWindowBorderColour = rgba($onSurfaceVariant55)